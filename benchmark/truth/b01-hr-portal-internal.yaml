  - id: T2
    title: "Medical leave reason broadcast to a third-party chat webhook"
    severity_min: high
    locations: [{file: hr_portal/app.py, lines: [10, 11]}]
    verified_by: "read: reason interpolated into webhook body"
decoys: []
no_mandatory_findings: false
human_review_notes: []
