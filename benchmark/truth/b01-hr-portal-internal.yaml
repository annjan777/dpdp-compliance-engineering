case: b01-hr-portal-internal
trap: "Developer-style claim that an internal, employee-only tool is outside the Act."
status:
  accept: [applicable]
  partial: {partially-applicable: 0.5, potentially-applicable: 0.5}
  human_review: false
  rationale: "Employee data of an Indian company is digital personal data (Act s.2(t), s.3(a)). Internal use is not an exclusion; s.7(i) is a lawful ground, not an exemption."
