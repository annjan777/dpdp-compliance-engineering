legal_questions:
  - "If the author later adds telemetry, crash reporting, cloud sync, accounts or support uploads so that user data reaches the developer, does the developer become a Data Fiduciary for that new activity (Act s.2(i), s.3(a)), requiring a fresh applicability assessment?"
  - "If an organisation (e.g. an employer or business) deploys the tool to record expenses about other identifiable people, does the s.3(c)(i) personal/domestic exclusion stop applying to that deployer?"
summary: "Pocket Ledger is a local-only CLI with no network, accounts or telemetry (verified in ledger/core.py: only csv, os, sqlite3, tempfile); each individual processes their own expense data for personal purposes, which falls within the Act s.3(c)(i) exclusion, and the developer receives no personal data and so is not a Data Fiduciary. The Act is therefore not currently applicable on the verified code, though the conclusion rests on the code rather than the author's assumption and must be revisited if any data flow to the developer or an organisational deployment is added. The main code issue is a security weakness: the full expense export defaults to a predictable file in the shared temp directory; the other items are optional hardening (file permissions, entry deletion)."
