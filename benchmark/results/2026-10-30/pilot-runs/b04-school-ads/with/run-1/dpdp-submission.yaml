legal_questions:
  - "Is the government-run Odisha school (or the department operating this app) 'State' or an instrumentality under Article 12, so that Act s.17(4) disapplies s.8(7) and s.12(3)? Who is the Data Fiduciary: the school, the state education department, or an app vendor?"
  - "What is the lawful ground for attendance recording and absence SMS: Act s.7(b) (State service), s.7(c) (State function), or consent? This decides whether s.5 notice and s.11-12 rights apply."
  - "Does the Rules Sch.4 Part A educational-institution exemption cover attendance tracking and parent SMS, and what is its exact limiting condition? (Advertising appears to fall outside it.)"
  - "Is the ad network a processor of the school or an independent Data Fiduciary (Act s.2(i), s.2(k))? Does sponsored content on the learning page with vendor-side tracking amount to the school 'undertaking' targeted advertising directed at children under s.9(3)?"
  - "Is the ad network's foreign hosting country subject to any Central Government restriction under Act s.16 or any stricter sectoral or state education rule?"
  - "Which attendance and pupil records must be kept under education law or Rules r.8(3), and for how long?"
summary: "The app processes digital personal data of school children (classes 1-10) in India, so the Act applies (s.3(a), s.2(t), s.2(f)). The substantive duties commence on 13 May 2027 under G.S.R. 843(E). They are applicable but not yet in force on the 2026-10-31 assessment date. The most serious problem is that pupils' learning behaviour, class and DOB are sent to a foreign ad network and used for targeted ads. That conflicts with s.9(3) and falls outside any Sch.4 educational exemption. There are also no access controls, no encryption, no logging and no breach or grievance processes. This is an engineering assessment, not legal advice."
