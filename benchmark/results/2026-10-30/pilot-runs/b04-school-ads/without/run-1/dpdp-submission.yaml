legal_questions:
  - "Most substantive DPDP obligations (ss.4-17 and Rules r.3-r.16) commence 18 months after notification of the Rules (approx. 13 May 2027); confirm the commencement dates relied on and the remediation timeline."
  - "Has the Central Government notified the Odisha school or education department as an instrumentality of the State exempt under Act s.17(2)(a) or under s.17(4)/s.7?"
  - "Does attendance marking and absence SMS fall within Act s.7(b)/(c) legitimate uses and/or the Fourth Schedule educational-institution exemption from s.9(1) and s.9(3) under Rules r.12, so that verifiable parental consent is not needed for that purpose?"
  - "Is the ad network a Data Processor of the school or an independent Data Fiduciary, and who (school, state department, or app vendor) is the Data Fiduciary for the sponsored-content feature?"
  - "Is the ad network's host country subject to any restriction notified under Act s.16(1), and do sectoral rules (e.g. Odisha/RTE or education department guidelines) impose stricter limits preserved by s.16(2)?"
  - "Can any form of sponsored content on a government school learning page be lawful for under-18 users given s.9(3), even with parental consent?"
summary: "The app processes digital personal data of children (classes 1-10) and parent mobile numbers in India, so the DPDP Act applies, with the government school as Data Fiduciary; attendance processing is plausibly covered by State legitimate use and the Rules' educational-institution exemption, but feeding pupil IDs, class, DOB, topics and dwell time to an offshore ad network and serving targeted ads is tracking, behavioural monitoring and targeted advertising of children prohibited by s.9(3) and lacks verifiable parental consent. Supporting gaps include plaintext storage without access control or logging, no breach process, no retention/erasure, and no data principal rights or grievance channel; most obligations commence around May 2027."
