legal_questions:
  - "Is login/delivery processing of customer phone numbers grounded in consent (requiring s.5 notice and s.6 consent) or in the s.7(a) 'voluntarily provided' legitimate use, and is a notice shown in the client app (not in this repo)?"
  - "Which Razorpay payment data does the operator receive and retain, and is Razorpay a processor or an independent Data Fiduciary for that data?"
  - "Can customers be under 18, which would trigger verifiable parental consent under s.9 and Rules r.10?"
  - "Which login/traffic logs must be retained for one year under Rules r.8(3) versus erased under s.8(7)?"
  - "Confirm commencement dates against G.S.R. 843(E): substantive duties (s.4-s.17, Rules r.3, r.5-r.16) are reported to commence on 13 May 2027, after this assessment date (2026-10-31)."
summary: "A Kolkata grocery-delivery API that collects customers' phone numbers for OTP login and takes Razorpay payments processes digital personal data in India as a Data Fiduciary, so the DPDP Act applies; the substantive duties commence on 13 May 2027, so they are applicable but not yet in force. The most serious problems are a hardcoded, exported Razorpay secret, plaintext logging of phone numbers with live OTPs, and OTPs that never expire and have no attempt limits; there is also no erasure of stored phone numbers and no security event logging as required by s.8(5)/Rules r.6 and s.8(7)."
