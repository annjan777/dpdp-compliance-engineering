legal_questions:
  - "Is login and order processing based on consent (s.6, requiring a r.3 notice) or on the voluntary-provision legitimate use under s.7(a)? And is a notice shown in a client app that is not in this repo?"
  - "Is there a written contract with the SMS gateway and with Razorpay that meets s.8(2), and are they acting as processors or as independent fiduciaries?"
  - "Can children (under 18) place orders? If so, what verifiable parental consent mechanism is needed under s.9 and r.10?"
  - "What retention period applies to customer and order data, given s.8(7) and r.8, and any sectoral or tax retention duties?"
  - "Where do the data principal rights (s.11 to s.13) and grievance redressal (s.8(10)) live, and what contact details are published under s.8(9)?"
summary: "The Act applies: a Kolkata grocery-delivery API collects customers' phone numbers in digital form in India to authenticate them (s.3(a)), so the operator is a Data Fiduciary. The main problems are security safeguard failures under s.8(5) and r.6: phone numbers and OTPs are logged in plaintext, a payment secret is hardcoded, and OTPs never expire and have no attempt or rate limits. There is also indefinite retention of OTP data (s.8(7)). Whether notice and consent are required, and whether processor contracts are in place, cannot be told from the code."
