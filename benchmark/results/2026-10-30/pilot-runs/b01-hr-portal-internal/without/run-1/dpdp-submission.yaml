legal_questions:
  - "Does the employment legitimate use in s.7(i) cover sending identifiable health reasons to a company-wide or team Slack channel, or only disclosure to the approving manager and HR?"
  - "Is there a valid contract with Slack as Data Processor under s.8(2), and are the security terms in r.6(1)(f) included? Is Slack storage outside India subject to any s.16 restriction?"
  - "Most Data Fiduciary obligations (s.8, s.11-13, Rules r.3-r.8) take effect 18 months after the Rules were notified on 13 Nov 2025, around May 2027. Should remediation be planned for that date, and is any part already in force?"
  - "How long may leave and medical records be kept to satisfy labour law, such as the Factories Act or the Maharashtra Shops and Establishments Act, before s.8(7) requires erasure?"
  - "If a Slack disclosure has already happened, does it count as a personal data breach that must be reported to the Board and to affected employees under s.8(6) and r.7?"
summary: "The portal is run by a company in Pune and processes digital personal data of employees in India: names, work emails, reporting lines and free-text medical leave reasons. The DPDP Act therefore applies under s.3(a). Employment purposes give a consent-free legitimate use under s.7(i), but the s.8 security, retention and processor obligations still apply. The main problems are that list_leaves exposes every employee's medical reason to any caller, health details are broadcast to Slack, a webhook secret is hardcoded, and the code has no encryption, access logging or retention controls."
