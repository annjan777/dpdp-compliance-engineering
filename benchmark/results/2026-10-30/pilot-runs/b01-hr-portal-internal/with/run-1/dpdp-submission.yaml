legal_questions:
  - "Does Act s.7(i) (employment purposes) cover collecting and storing the specific medical reason for leave, or only the fact of leave? If not, what ground (consent under s.6) applies?"
  - "Is sharing an employee's medical leave reason to a Slack channel within the s.7(i) employment purpose, and who are the recipients of that channel?"
  - "Is Slack (or the webhook operator) a Data Processor under a valid s.8(2) contract, and where is the data stored (s.16 / any notified restriction)?"
  - "What retention period for leave and medical records is required by Indian labour/shops-and-establishments law, and how does it interact with s.8(7) and Rules r.8(3)?"
  - "Where and how does the company publish the s.8(9) contact and the s.8(10) grievance mechanism for employees? (Not visible in this repo.)"
  - "Confirm the operator is a private company (not 'State' under Art. 12) and that no s.17(3)/s.17(5) exemption notification covers it."
summary: "The HR leave portal processes digital personal data of employees of a Pune company (names, work emails, manager links, free-text medical leave reasons) in India, so the Act applies (s.3(a)) with the company as Data Fiduciary, likely relying on s.7(i) employment legitimate use; the substantive duties (s.4-s.17, Rules r.3, r.5-r.16) commence on 13 May 2027 and are not yet in force on 2026-10-30. The most serious problems are a broken access control that exposes every employee's medical leave reason to any caller, unauthenticated writes, and broadcasting names plus medical reasons to Slack, followed by a hardcoded webhook secret, plaintext storage, no audit logging and no retention/erasure."
