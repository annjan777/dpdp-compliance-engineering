legal_questions:
  - "Can crash reporting rely on s.7(a) (voluntarily provided for a specified purpose), or is consent under s.6 required, given the user never actively chooses to submit a report?"
  - "Are the OS username and the file and folder names in crash reports 'personal data' under s.2(t) for the developers, and is the two-person team the Data Fiduciary for crash data under s.2(i)?"
  - "Does any s.17(3) or s.17(5) notification (e.g. a startup exemption) cover this two-person team? None is known as of 2026-10-31."
  - "Substantive duties (s.4 to s.17, Rules r.3 and r.5 to r.16) start on 13 May 2027 under G.S.R. 843(E). Confirm that date against the gazette."
  - "If users can be under 18, does s.9 parental consent apply to crash telemetry from them?"
summary: "The tool's local photo sorting is a user's personal or domestic processing and falls outside the Act under s.3(c)(i). The crash-reporting path is different: it sends the user's email, OS username, folder path, file names and traceback to a server run by a team based in India, so the developers process digital personal data in India as a fiduciary under s.3(a). That activity is in scope, but its substantive duties start on 13 May 2027. The main gaps are no notice or consent, collection beyond what debugging needs, no opt-out, and no retention or rights process; telemetry.py is currently a stub that only buffers reports in memory."
