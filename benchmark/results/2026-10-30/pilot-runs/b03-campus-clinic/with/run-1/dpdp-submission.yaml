legal_questions:
  - "Is the publicly funded university (or its health centre) 'State' or an instrumentality under Article 12, so that s.17(4) removes s.8(7) and s.12(3) for its processing? Does any s.7(b)/(c) ground cover clinic services?"
  - "What is the lawful ground per purpose: s.7(a) voluntary provision for booking/care, s.7(i) for staff, or consent? Analytics and newsletter appear to need consent."
  - "Is the analytics vendor a Data Processor under a valid s.8(2) contract or an independent fiduciary receiving health data? Do any sectoral health-data rules restrict the US transfer under s.16(2)?"
  - "Can users be under 18 (e.g. first-year students or minors on campus), and if so does the Rules Sch.4 Part A clinical-establishment / educational-institution exemption cover booking but not third-party analytics tracking?"
  - "Which appointment and log data must be retained for at least one year under Rules r.8(3) (and any medical-records law) versus erased under s.8(7) on account deletion?"
summary: "The portal processes digital personal data, including health symptoms, of identifiable students and staff in India, and the university decides why and how, so the Act applies (Act s.3(a), s.2(t)). Being an 'internal university portal' is not an exemption, and only a partial State carve-out (s.17(4)) is open for legal review. The substantive duties apply from 13 May 2027 (G.S.R. 843(E)). The most serious problems are an IDOR exposing every patient's appointments and symptoms, health data and emails sent to a US analytics vendor without a lawful ground, pre-ticked marketing consent, no notice or withdrawal, incomplete erasure, and PII in logs."
