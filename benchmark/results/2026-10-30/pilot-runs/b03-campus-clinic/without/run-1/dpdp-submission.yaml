legal_questions:
  - "Is the publicly funded university (or its health centre) a 'State' instrumentality notified under Act s.17(2)(a), or eligible under s.7(b)/Rules r.5, and would any such exemption reach analytics and marketing processing?"
  - "Which processing is covered by the Fourth Schedule exemptions under Rules r.12 (educational institutions; clinical establishments/healthcare professionals) from s.9(1) and s.9(3) for minor students, and which (analytics, newsletter) still needs verifiable parental consent?"
  - "Can the clinic rely on s.7(f)/(g) (medical treatment / health services) for any clinical processing, or is consent under s.6 the only basis?"
  - "Has the Central Government restricted transfers to the analytics vendor's country under s.16(1), and does any sectoral rule (e.g. health-records rules) impose stricter localisation under s.16(2)?"
  - "Given the phased commencement in Rules r.1(3) (most substantive obligations, including r.3 and r.6-r.15, from about 13 May 2027), what remediation timeline applies, and could the university be notified as a Significant Data Fiduciary under s.10?"
summary: "The DPDP Act applies. The portal processes digital personal data of identifiable students and staff, including health symptoms, in India, and nothing in the Act exempts an 'internal university portal'. Any State-instrumentality, education or healthcare exemption is limited and needs legal review. The worst problems are symptoms and emails sent to a US analytics vendor without notice or consent, an IDOR exposing everyone's appointments, opt-out marketing consent, incomplete erasure, and no notice, children's safeguards, rights handling or breach readiness."
