legal_questions:
  - "Does the Chennai company process this data under a contract with a person outside India (the US insurer), and are all Data Principals outside India, so that the Act s.17(1)(d) exemption is fully met for every record?"
  - "Under the s.17(1)(d) exemption, do the Rules r.6 minimum safeguards apply alongside Act s.8(5) (which stays in force)? Or does only the general s.8(5) duty apply?"
  - "Does s.8(1) still bind the Chennai company as a Data Fiduciary, or is it only a Data Processor for the US insurer (Act s.2(i), s.2(k))? Who owes the s.8(5) duty for this processing?"
  - "s.8(5) commences on 13 May 2027 (G.S.R. 843(E)). Please confirm that date against the gazette."
  - "Because breach notification (Act s.8(6)) is disapplied by s.17(1)(d), what contractual and US-law (e.g. HIPAA) breach duties apply instead? This is outside the DPDP scope."
summary: "The ETL runs in Chennai and processes digital personal data in India, so the Act applies under s.3(a). But all the Data Principals are US residents and the processing is done under a contract with a US insurer, so s.17(1)(d) exempts it from most of the Act. Only the s.8(1) accountability duty and the s.8(5) security safeguards still apply, and they come into force on 13 May 2027. The code has serious security gaps that affect those surviving duties: SSNs and names are logged in plaintext, SSN, date of birth and diagnosis are stored unencrypted in a SQLite file with no access control, and nothing checks that the exemption's 'no India residents' condition actually holds."
