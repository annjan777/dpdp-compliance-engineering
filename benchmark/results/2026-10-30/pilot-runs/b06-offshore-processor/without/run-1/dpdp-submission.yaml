legal_questions:
  - "Does the s.17(1)(d) exemption hold in full: are all data principals in the feed genuinely outside India, and is the processing done strictly under the contract with the US insurer (no Indian residents, NRIs with Indian addresses, or onward use)?"
  - "Who bears the s.8(1) and s.8(5) obligations that s.17(1)(d) preserves: the foreign insurer as Data Fiduciary (s.3(a) processing within India) or, in practice, the Chennai company as Data Processor? Do Rules r.6 safeguards bind it directly or only through contract?"
  - "Has the Central Government issued any notification affecting the s.17(1)(d) exemption, and do any sectoral Indian rules (e.g. CERT-In directions on log retention and incident reporting) apply separately?"
summary: "The Chennai company processes digital personal data within India (s.3(a)), but only for non-resident US data principals under a contract with a foreign insurer, so s.17(1)(d) exempts it from most of the Act. Consent, notice, data principal rights, breach notification and retention do not apply, but s.8(1) and the s.8(5) duty to keep reasonable security safeguards still do. The code breaches s.8(5): it logs full SSNs with names and stores SSNs and diagnosis codes unencrypted in an SQLite file with no access control."
