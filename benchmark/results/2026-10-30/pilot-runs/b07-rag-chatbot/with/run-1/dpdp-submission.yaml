legal_questions:
  - "Is the lender the Data Fiduciary and the chatbot operator a processor, or is the operator an independent fiduciary (Act s.2(i), s.2(k))?"
  - "What is the lawful ground for each purpose (loan-servicing chat, using profile data in prompts, document upload): consent or s.7(a) voluntary provision?"
  - "Is the US LLM provider a processor under a valid contract, and do any s.16 notifications or stricter sectoral rules (e.g. RBI digital lending / outsourcing directions, s.16(2)) restrict sending PAN and income data abroad?"
  - "On account deletion, which data must be retained (Rules r.8(3) one-year log retention; KYC/lending record-keeping laws) and which must be erased under s.8(7)?"
  - "Can minors use the app (Act s.9), or is age reliably excluded by the loan relationship?"
  - "Confirm the commencement split in G.S.R. 843(E): substantive duties (s.4-s.17, Rules r.3, r.5-r.16) apply from 13 May 2027 and are not yet enforceable on 2026-10-31."
summary: "The app processes digital personal data (name, PAN, phone, income, chat text, loan documents) of borrowers in India, so the DPDP Act applies; the substantive fiduciary duties commence on 13 May 2027 and are applicable but not yet in force at the assessment date (2026-10-31). The most serious problem is a global, unscoped vector store that leaks one borrower's documents into other borrowers' LLM context, followed by incomplete account deletion (history and documents survive) and unminimised transfer of PAN/income to a US LLM provider without evidence of a processor contract. This is an engineering assessment, not legal advice."
