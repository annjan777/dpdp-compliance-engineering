legal_questions:
  - "As of 31 Oct 2026 most Data Fiduciary obligations (s.4-s.10, s.11-s.17) are not yet in force under the phased commencement (expected ~13 May 2027); what is the compliance timeline and are any obligations enforceable now?"
  - "Do RBI digital lending directions / data localisation requirements (preserved by Act s.16(2)) restrict sending borrower PAN, income and loan data to a US-hosted LLM provider?"
  - "Is consent (s.6) or a legitimate use (s.7) the correct lawful basis for each purpose (loan servicing chat vs. document Q&A), and what notice text satisfies Rules r.3?"
  - "Will the operator be notified as a Significant Data Fiduciary under s.10 given volume/sensitivity of financial data, triggering DPO, DPIA and audit duties (Rules r.13)?"
  - "Does the cross-user document exposure already constitute a personal data breach requiring intimation to the Board and affected principals under s.8(6) and Rules r.7?"
  - "What retention period applies to chat history and documents given sectoral record-keeping obligations that may override erasure under s.8(7)/s.12(3)?"
  - "Can minors use the service (s.9), or is it restricted to adult borrowers by design?"
summary: "The loan-helper chatbot processes digital personal data (names, PAN, phone, income, chat transcripts, uploaded documents) of borrowers in India, so the DPDP Act applies under s.3(a), with the operator as Data Fiduciary and the US LLM provider as Data Processor. The most serious defect is a shared, un-scoped vector store that leaks one user's documents into other users' prompts (also a prompt-injection vector); deletion is incomplete, PAN/phone/income are sent to the LLM unnecessarily, and there is no retention, notice/consent, logging or processor-contract evidence. Substantive obligations are phasing in (expected May 2027), but the security flaws should be fixed immediately."
