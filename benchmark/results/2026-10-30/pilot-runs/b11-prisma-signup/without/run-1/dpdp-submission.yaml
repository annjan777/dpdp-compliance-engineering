legal_questions:
  - "Is there any lawful basis for a private gym-booking business to collect and store Aadhaar numbers? Consider the Aadhaar Act, 2016 (s.29, s.57 after Puttaswamy) and UIDAI rules on storing Aadhaar (Aadhaar Data Vault, masking). Should the field be dropped entirely?"
  - "Commencement: under the 13 Nov 2025 notification, the substantive obligations in Act ss.3-17 and Rules r.3-r.16 take effect 18 months later (around 13 May 2027). What is the remediation timeline, and does any existing data need a fresh notice under Act s.5(2)?"
  - "Can sending booking-related messages rely on legitimate use under Act s.7(a) (data voluntarily given for a specified purpose), while promotional emails need separate, explicit consent?"
  - "Could the business be notified as a Significant Data Fiduciary under Act s.10? This is unlikely at this scale, but depends on volume and sensitivity, including Aadhaar."
summary: "This Next.js/Prisma fitness-booking app collects digital personal data (name, email, phone, Aadhaar, bookings) from people in India, so it is within the DPDP Act under s.3(a) and is not exempt; the substantive duties apply from about May 2027. The main gaps: an Aadhaar number collected without need and stored in plaintext; marketing consent that defaults to opted-in with no notice, consent record or way to withdraw; and an unvalidated mass-assignment signup. There is also no support for data-subject rights, retention limits, access logging or breach handling."
