legal_questions:
  - "Is the gym operator permitted to collect and store Aadhaar numbers at all for class booking, given restrictions under the Aadhaar Act and UIDAI regulations (outside DPDP), and if identity verification is needed, can a less intrusive identifier or masked/offline Aadhaar suffice?"
  - "What is the lawful ground for each purpose: is account/booking data covered by Act s.7(a) (voluntarily provided for a specified purpose) or does it need consent, and is marketing strictly consent-based?"
  - "Are existing users' marketing opt-ins (default true) valid at all, and how must legacy users be re-noticed or re-consented under Act s.5(2) before 13 May 2027?"
  - "Which email/marketing vendors and hosting providers act as Data Processors, and do contracts meet Act s.8(2) and Rules r.6(1)(f)?"
  - "Which data and logs must be retained for one year under Rules r.8(3) after account deletion, versus erased under Act s.8(7)?"
  - "Is there any evidence of a s.17(3)/s.17(5) exemption notification (e.g. startup class) covering this fiduciary? None was found in the repo."
summary: "The app is a fitness-class booking service for adults in India that digitally processes name, email, phone, Aadhaar number and booking history and sends marketing emails, so the Act applies (Act s.3(a), s.2(t)); the operator appears to be the Data Fiduciary, and no exclusion or exemption is evidenced. As of 2026-10-31 the substantive duties (s.4–s.17, Rules r.3, r.5–r.16) are applicable but not yet in force until 13 May 2027 under G.S.R. 843(E), so the gaps are build-now items with a fixed deadline. The main problems are unjustified, plaintext Aadhaar collection that is also returned in the API response, a pre-ticked marketing opt-in with no notice, consent record or withdrawal, and no erasure, logging or grievance mechanisms."
