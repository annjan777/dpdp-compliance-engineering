legal_questions:
  - "Who operates the forum, and is it an organisation (Data Fiduciary under s.2(i)) or an individual running it for personal/domestic purposes that s.3(c)(i) might exclude?"
  - "Is signup processing (email, display name, posts) covered by the s.7(a) legitimate use (voluntarily provided for a specified purpose), or should it rest on consent? The digest opt-in is treated here as consent-based."
  - "Can members be under 18? If so, s.9 verifiable parental consent (Rules r.10) applies at signup."
  - "On account deletion, should posts be erased, or kept anonymised for thread continuity? And what must be kept for one year under Rules r.8(3) versus erased under s.8(7)?"
  - "Does posting content made public on the forum fall under the s.3(c)(ii) exclusion for data the Data Principal made public, and for which uses?"
summary: "The forum processes digital personal data (emails, display names, posts) of members, and the README describes a Bengaluru community, so the Act applies under s.3(a). Its fiduciary duties come into force on 13 May 2027, so they apply from that date and are not enforceable yet. The most serious problem is in delete_account: it removes only the members row. Because SQLite reuses rowids, the next person to sign up inherits the deleted member's posts and digest opt-in. This was reproduced with synthetic data. It is a live data-exposure bug and also defeats erasure and consent, and consent cannot currently be withdrawn or proved."
