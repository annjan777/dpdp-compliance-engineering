legal_questions:
  - {id: Q-01, question: "Can any student users be under 18 (e.g. early-entry first-years)? If so, does Rules Sch.4 Part A item 1 (clinical establishment) or item 3 (educational institution) cover appointment processing, and is parental consent needed for the newsletter?", why: "Decides DPDP-CHD-01 and DPDP-CHD-02", provisions: ["Act s.9(1)", "Act s.9(3)", "Rules r.12", "Rules Sch.4 Part A item 1"], related: [DPDP-CHD-01, DPDP-CHD-02, PA-01, PA-02], blocking: false, owner: legal_reviewer, status: open, answer: null, answer_source: null}
  - {id: Q-02, question: "Is the university 'State' or an instrumentality of the State under Article 12, so that Act s.17(4) removes s.8(7) and s.12(3) for its processing?", why: "Changes erasure obligations (DPDP-RET-01, DPDP-RGT-03) and the available s.7 grounds", provisions: ["Act s.17(4)", "Act s.7(b)", "Act s.7(c)"], related: [DPDP-RET-01, DPDP-RGT-03, PA-01], blocking: false, owner: legal_reviewer, status: open, answer: null, answer_source: null}
  - {id: Q-03, question: "Which medical-records retention rule applies to appointment and symptom data, and exactly which fields must survive account erasure under Rules r.8(3)?", why: "Decides whether erasure deletes appointments (RETAIN_APPOINTMENTS_ON_ERASURE) and the retained field list (DPDP-SEC-05, DPDP-RET-01)", provisions: ["Act s.8(7)", "Rules r.8(3)", "Rules Sch.7"], related: [DPDP-RET-01, DPDP-SEC-05, PA-01], blocking: true, owner: legal_reviewer, status: open, answer: null, answer_source: null}
  - {id: Q-04, question: "Is the analytics vendor a processor under a valid contract with security clauses, and do any notifications or health-sector rules restrict transfer to its region?", why: "DPDP-FID-01, DPDP-SEC-06, DPDP-XB-01", provisions: ["Act s.8(2)", "Act s.16", "Rules r.6(1)(f)", "Rules r.15"], related: [DPDP-FID-01, DPDP-SEC-06, DPDP-XB-01, PA-03], blocking: false, owner: legal_reviewer, status: open, answer: null, answer_source: null}
  - {id: Q-05, question: "Does appointment booking rely on s.7(a) (voluntarily provided for a specified purpose) or should it be consent-based?", why: "Decides whether s.5 notice applies to PA-01 (DPDP-LAW-02)", provisions: ["Act s.4", "Act s.7(a)"], related: [DPDP-LAW-02, DPDP-LAW-01, PA-01], blocking: false, owner: legal_reviewer, status: open, answer: null, answer_source: null}
  - {id: Q-06, question: "Which Eighth Schedule languages must the newsletter notice offer, and is the placeholder notice wording acceptable?", why: "DPDP-NOT-01, DPDP-NOT-03", provisions: ["Act s.5(3)", "Rules r.3"], related: [DPDP-NOT-01, DPDP-NOT-03], blocking: true, owner: legal_reviewer, status: open, answer: null, answer_source: null}
  - {id: Q-07, question: "Which vendor contracts and lawful ground apply to the analytics processing itself?", why: "DPDP-LAW-01 for PA-03", provisions: ["Act s.4"], related: [DPDP-LAW-01, PA-03], blocking: false, owner: legal_reviewer, status: open, answer: null, answer_source: null}
