# Worked example: hypothetical app that was built assuming DPDP did not apply.
# All people, approvals and organisations are fictional. Approvals marked "hypothetical" exist only to
# demonstrate the approval gate; a real run records real approvers.
schema_version: 1

project:
  id: campus-clinic
  name: Campus Clinic Appointments
  purpose: "Internal portal of a publicly funded university's health centre. Students and staff register, book appointments with symptoms, and may subscribe to a health newsletter."
  assessment_date: 2026-10-29
  repo_ref: "7145e53 (assessed); f52e15c (changes); e5c1c42 + aa43327 (review round 1 fixes); c8a150c (round 2 fixes)"
  config_ref: .dpdp/config.yaml
  assessed_by: [discovery, legal-mapping, privacy-engineering, implementation, independent-verification]
  scope_of_assessment: "Whole repository at 7145e53 (clinic/, tests/). Not inspected: hosting, backups, the email provider integration beyond the stub, vendor contracts."
  disclaimer: "Engineering assessment, not legal advice. Legal conclusions require qualified review."

