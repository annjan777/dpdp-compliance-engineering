# ---------------- Phase B ----------------
applicability:
  overall:
    status: applicable
    confidence: medium
    reasoning: "All four activities process digital personal data of identifiable students and staff in India for purposes the health centre decides (PA-01..PA-04). 'Internal portal' (E-001) is not an exclusion or exemption under Act s.3(c) or s.17. Substantive obligations commence on 2027-05-13. Confidence is medium because the State-instrumentality question (Q-02) can remove some erasure duties and the lawful ground for bookings (Q-05) is unconfirmed."
    provisions: ["Act s.2(t)", "Act s.3(a)", "Act s.4", "Act s.7(a)", "Act s.7(i)", "Act s.17(4)"]
    legal_review_required: true
  activities:
    - activity: PA-01
      status: applicable
      gates: {personal_data: "yes", digital: "yes", territorial: "yes (A-01)", exclusion: none, role: fiduciary, exemption: "none evidenced; s.17(4) possible (Q-02)"}
      lawful_ground: "s.7(a) candidate (Q-05)"
      provisions: ["Act s.2(t)", "Act s.3(a)", "Act s.7(a)"]
      facts: [E-002, E-007]
      assumptions: [A-01]
      reasoning: "Students voluntarily provide data to book appointments; health data is ordinary personal data under the Act. The team's 'internal' claim (E-001) does not match any exclusion."
      confidence: medium
      legal_questions: [Q-02, Q-03, Q-05]
    - activity: PA-02
      status: applicable
      gates: {personal_data: "yes", digital: "yes", territorial: "yes", exclusion: none, role: fiduciary, exemption: none}
      lawful_ground: consent
      provisions: ["Act s.4", "Act s.6(1)"]
      facts: [E-003]
      reasoning: "Newsletter is not needed for the service, so consent is the only fitting ground. A pre-ticked default does not meet the s.6(1) affirmative-action standard for new consents; how existing pre-commencement opt-ins are treated under s.5(2) is open (Q-09)."
      confidence: medium
      legal_questions: [Q-09]
    - activity: PA-03
      status: applicable
      gates: {personal_data: "yes (before change)", digital: "yes", territorial: "yes", exclusion: none, role: "fiduciary; vendor role unknown", exemption: none}
      lawful_ground: unknown
      provisions: ["Act s.8(1)", "Act s.8(2)", "Act s.16"]
      facts: [E-005]
      reasoning: "Identifiable health data was sent abroad to a vendor with unknown role and contract."
      confidence: medium
      legal_questions: [Q-04]
    - activity: PA-04
      status: applicable
      gates: {personal_data: "yes", digital: "yes", territorial: "yes", exclusion: none, role: fiduciary, exemption: none}
      lawful_ground: "s.7(i)"
      provisions: ["Act s.7(i)", "Act s.8(5)"]
      facts: [E-009]
      reasoning: "Employment-related processing: lawful without consent, but general duties (security, retention) remain."
      confidence: high
      legal_questions: []

