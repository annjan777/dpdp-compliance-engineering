# ---------------- Phase C ----------------
findings:
  - {id: F-01, req_id: DPDP-SEC-02, category: legal-gap, mandatory: true, title: "Any user can read any user's appointments (IDOR)", description: "get_appointments never checks requester_id", applicability_status: applicable, severity: critical, priority: P0, technical_impact: "Exposure of health data across all patients", evidence: [E-006], status: verified}
  - {id: F-02, req_id: null, category: security-vulnerability, mandatory: false, title: "Name, email and phone written to application logs", description: "register() logs contact data in plaintext", applicability_status: applicable, severity: high, priority: P1, technical_impact: "Personal data spreads to log stores with wider access", evidence: [E-004], status: verified}
  - {id: F-03, req_id: DPDP-FID-01, category: legal-gap, mandatory: true, title: "Email and symptom text sent to an overseas analytics vendor with unknown contract", description: "Booking event payload includes email and symptoms", applicability_status: applicable, severity: high, priority: P1, technical_impact: "Health data disclosed abroad without known safeguards", evidence: [E-005], status: implemented}
  - {id: F-04, req_id: DPDP-CON-01, category: legal-gap, mandatory: true, title: "Newsletter consent is pre-ticked and stored as an overwritable boolean", description: "Default opt-in; no notice version; no withdrawal history", applicability_status: applicable, severity: medium, priority: P1, technical_impact: "Consent cannot be proven; legal status of existing opt-ins is open (Q-09)", evidence: [E-003], status: verified}
  - {id: F-05, req_id: DPDP-NOT-01, category: legal-gap, mandatory: true, title: "No notice before consent", description: "No notice content or versioning", applicability_status: applicable, severity: medium, priority: P2, technical_impact: "Consent not informed", evidence: [E-008], status: in-progress}
  - {id: F-06, req_id: DPDP-RET-01, category: legal-gap, mandatory: true, title: "Account deletion leaves data behind and never reaches the vendor", description: "Only the users row is deleted; vendor not told; no processing log", applicability_status: applicable, severity: high, priority: P1, technical_impact: "Residual personal data at vendor; no record for the one-year retention duty", evidence: [E-007], status: verified}
  - {id: F-07, req_id: DPDP-RGT-02, category: legal-gap, mandatory: true, title: "No access summary", description: "No way to give a user a summary of data and recipients", applicability_status: applicable, severity: low, priority: P2, technical_impact: "Rights request cannot be met", evidence: [E-008], status: verified}
  - {id: F-08, req_id: DPDP-SEC-01, category: legal-gap, mandatory: true, title: "Symptom text stored unprotected at rest", description: "No field-level protection; DB encryption unknown", applicability_status: applicable, severity: high, priority: P1, technical_impact: "DB or backup leak exposes health data", evidence: [E-002], status: planned}
  - {id: F-09, req_id: DPDP-BRE-02, category: legal-gap, mandatory: true, title: "No breach detection or notification process", description: "No incident record, runbook or templates", applicability_status: applicable, severity: medium, priority: P2, technical_impact: "Cannot meet the 72-hour Board report", evidence: [E-008], status: planned}
  - {id: F-10, req_id: DPDP-GRV-02, category: legal-gap, mandatory: true, title: "No grievance channel or published contact", description: "No contact, no intake, no due dates", applicability_status: applicable, severity: medium, priority: P2, technical_impact: "Users cannot raise grievances", evidence: [E-008], status: planned}
  - {id: F-11, req_id: DPDP-NOT-02, category: legal-gap, mandatory: true, title: "Existing pre-ticked subscribers need a notice; re-confirmation depends on Q-09", description: "Legacy opt-ins were not migrated into the consent ledger", applicability_status: applicable, severity: medium, priority: P2, technical_impact: "Newsletter stops for legacy users until they re-confirm", evidence: [E-003], status: planned}
  - {id: F-13, req_id: DPDP-SEC-02, category: legal-gap, mandatory: true, title: "Erased user ids were reused, attaching retained records and consent to the next new user", description: "Found by independent review of f52e15c: INTEGER PRIMARY KEY without AUTOINCREMENT; kept appointments and consent rows matched the new account", applicability_status: applicable, severity: critical, priority: P0, technical_impact: "A new user could read an erased user's health data and inherit their consent", evidence: [E-014], status: verified}
  - {id: F-14, req_id: DPDP-RET-01, category: legal-gap, mandatory: true, title: "Vendor erasure request used an id the vendor never received; email provider not notified", description: "Found by independent review: request_analytics_erasure sent an internal id abroad and could match nothing", applicability_status: applicable, severity: high, priority: P1, technical_impact: "Erasure did not reach processors", evidence: [E-014], status: verified}
  - {id: F-15, req_id: null, category: security-vulnerability, mandatory: false, title: "Any caller could erase any account; log recorded the wrong actor", description: "Found by independent review: delete_user had no requester check", applicability_status: applicable, severity: high, priority: P1, technical_impact: "Malicious erasure; misleading audit trail", evidence: [E-014], status: verified}
  - {id: F-16, req_id: DPDP-RGT-02, category: legal-gap, mandatory: true, title: "Access summary open to clinicians and listed recipients the user's data never reached", description: "Found by independent review: _authorise allowed clinicians; recipients were static", applicability_status: applicable, severity: medium, priority: P2, technical_impact: "Inaccurate s.11 summary; over-broad access", evidence: [E-014], status: verified}
  - {id: F-17, req_id: DPDP-SEC-05, category: legal-gap, mandatory: true, title: "Processing-log purge exists but is never scheduled; log sits in the primary DB", description: "Found by independent review", applicability_status: applicable, severity: medium, priority: P2, technical_impact: "Logs kept indefinitely; not access-restricted", evidence: [E-014], status: planned}
  - {id: F-18, req_id: null, category: operational-weakness, mandatory: false, title: "Erasure fails with foreign keys enforced; registration left half-created rows on consent error", description: "Found by independent review. Registration part fixed in e5c1c42; foreign-key part open (depends on Q-03)", applicability_status: applicable, severity: low, priority: P3, technical_impact: "Erasure errors on stricter DB settings", evidence: [E-014], status: in-progress}
  - {id: F-19, req_id: DPDP-SEC-03, category: legal-gap, mandatory: true, title: "Denied access attempts are not logged", description: "Found by independent review", applicability_status: applicable, severity: low, priority: P3, technical_impact: "Unauthorised access attempts invisible to monitoring", evidence: [E-014], status: planned}
  - {id: F-20, req_id: null, category: security-vulnerability, mandatory: false, title: "Erasure sent non-subscribers' email addresses to the email provider", description: "Found by independent review round 2 in P-12 code; the test asserted this behaviour", applicability_status: applicable, severity: medium, priority: P2, technical_impact: "New disclosure of addresses the provider never held", evidence: [E-015], status: verified}
  - {id: F-21, req_id: null, category: operational-weakness, mandatory: false, title: "Erasure was not atomic", description: "Consent withdrawal committed before a users DELETE that can fail", applicability_status: applicable, severity: low, priority: P3, technical_impact: "Half-completed erasure state", evidence: [E-015], status: verified}
  - {id: F-22, req_id: null, category: operational-weakness, mandatory: false, title: "P-12 changed permissions without the approval gate; no staff erasure path remains", description: "Process failure by the implementer, found by independent review round 2; approval recorded retroactively in the worked example", applicability_status: applicable, severity: low, priority: P3, technical_impact: "Behaviour change shipped without owner sign-off; grievance-driven erasure impossible", evidence: [E-015], status: planned}
  - {id: F-23, req_id: null, category: security-vulnerability, mandatory: false, title: "Erasure can still send an address the provider never received (consented then withdrew before any send)", description: "Found by independent review round 3: 'ever consented' is used as a proxy for 'provider holds the address'", applicability_status: applicable, severity: low, priority: P3, technical_impact: "Rare extra disclosure of an email address to an existing processor", evidence: [E-016], status: planned}
  - {id: F-12, req_id: null, category: best-practice, mandatory: false, title: "Offer a downloadable copy of a user's data", description: "Not required by the Act (s.11 is a summary); may help users", applicability_status: not-currently-applicable, severity: low, priority: P3, technical_impact: "None (optional)", evidence: [E-008], status: open}

